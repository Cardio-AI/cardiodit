# Historical temporal-alignment experiment; recompute scale_factor for your data.
# FM ablation step 01 — zero attention and MLP dropout
#
# Changes from FM baseline:
#   attn_drop: 0.1 → 0.0
#   mlp_drop:  0.1 → 0.0
#
# Rationale: identical to DDPM step 01.  The flow matching trajectory noise
# acts as a strong implicit regulariser; additional dropout destabilises
# training unnecessarily.

scheduler_type: "flow_matching"

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0                # changed: was 0.1
    mlp_drop: 0.0                 # changed: was 0.1
    spacing: null
    self_conditioning: false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0

training:
  objective_loss: huber_legacy
  allow_legacy_latents: true
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 8
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  grad_accum_steps: 4
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true
