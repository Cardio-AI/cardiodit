# Historical temporal-alignment experiment; recompute scale_factor for your data.
# FM ablation step 06 — self-conditioning  [all FM improvements enabled]
#
# Changes from step 05:
#   model.params.self_conditioning: false → true
#   training.self_conditioning:     false → true
#
# Rationale: identical to DDPM step 07.  Self-conditioning (Chen et al. 2022)
# allows the model to refine its own x0 estimate across forward passes rather
# than predicting from scratch.  For cardiac cine MRI the signal is highly
# structured and temporally predictable, making a rough x0 estimate at step t
# an especially informative conditioning signal.
#
# At inference: x0_pred returned by scheduler.step is passed as x_self_cond
# for the next denoising step (implemented in sample_dit.py).
#
# IMPORTANT: model.params.self_conditioning and training.self_conditioning
# must always match.
#
# This config is the full set of all FM improvements for CardioDiT.
# Latent augmentation is intentionally omitted (see Architecture_discussion.md).

scheduler_type: "flow_matching"

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]
    self_conditioning: true           # changed: was false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.5
  logit_std: 0.7

training:
  objective_loss: huber_legacy
  allow_legacy_latents: true
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 8
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: true            # changed: was false
  grad_accum_steps: 4
  normalize_latents: true
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true
