# Historical temporal-alignment experiment; recompute scale_factor for your data.
# DDPM ablation step 04 — offset noise  (DDPM-only)
#
# Change from step 03:
#   offset_noise_strength: 0.0 → 0.1
#
# Rationale: i.i.d. Gaussian noise has zero spatial mean, so noisy 4D latents
# at high noise levels always average to near zero regardless of the true
# cardiac structure's global intensity.  For CMR the latent mean encodes global
# myocardial signal level, which varies with contrast agent, scanner, and
# anatomy.  The model struggles to recover this from pure zero-mean noise.
#
# Offset noise adds a spatially-uniform per-channel component:
#   noise = randn_like(latents) + 0.1 × randn(B, C, 1, 1, 1, 1)
# The (B, C, 1, 1, 1, 1) shape broadcasts across all four 4D latent dims
# (D, H, W, T), giving each channel a uniform global perturbation.
# A coefficient of 0.05–0.1 is typical (Guttenberg 2023).

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  objective_loss: huber_legacy
  allow_legacy_latents: true
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  amp_dtype: bf16
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.1        # changed: was 0.0
  grad_accum_steps: 4
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true
