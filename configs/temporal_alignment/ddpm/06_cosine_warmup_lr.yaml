# Historical temporal-alignment experiment; recompute scale_factor for your data.
# DDPM ablation step 06 — cosine warmup LR scheduler
#
# No config change — cosine warmup is already the only LR schedule
# implemented in train_dit.py.  This step is present to keep the ablation
# sequence symmetric with the 3D codebase.
#
# In the 3D codebase this step switches optim.scheduler from "exponential"
# to "cosine_warmup".  The 4D train_dit.py always uses the LambdaLR warmup-
# cosine schedule; there is no exponential alternative.
#
# What cosine warmup provides:
#   - Linear ramp from lr/warmup_epochs to lr over warmup_epochs epochs.
#     Prevents large initial gradient steps from pushing the zero-initialised
#     AdaLN modulation weights away from their start.
#   - Cosine decay from lr to lr × min_lr_ratio after warmup.
# Both are controlled by warmup_epochs and min_lr_ratio, which are already
# present in all preceding configs.

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  objective_loss: huber_legacy
  allow_legacy_latents: true
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  amp_dtype: bf16
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.1
  grad_accum_steps: 4
  normalize_latents: true
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100              # linear warmup always enabled in train_dit.py
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true
