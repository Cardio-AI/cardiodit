# Historical temporal-alignment experiment; recompute scale_factor for your data.
# DDPM ablation step 05 — per-channel latent normalisation
#
# Changes from step 04:
#   normalize_latents: false → true
#   scale_factor: 1.0 → 1.0  (per-channel norm supersedes the global scalar)
#
# Rationale: VQ-GAN latent channels do not have equal variance.  Channels
# encoding high-frequency cardiac texture can have significantly larger
# magnitude than those encoding global intensity structure.  The diffusion
# process treats all channels equally, so high-variance channels dominate
# the loss.  Per-channel normalisation (subtract mean, divide by std over
# the full training set) levels the playing field.  Standard in SD2+, FLUX.
#
# Implementation: DiTTrainer computes mean/std over two passes through the
# training loader on the first run.  Set latent_stats_path to a saved .pt
# file on subsequent runs to avoid recomputing (save from checkpoint).
# The stats are saved inside every checkpoint automatically.

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  objective_loss: huber_legacy
  allow_legacy_latents: true
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 4
  amp_dtype: bf16
  scale_factor: 1.0                 # per-channel norm makes the global scalar redundant
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.1
  grad_accum_steps: 4
  normalize_latents: true           # changed: was false
  latent_stats_path: null           # set to a .pt path to skip recomputation

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true
