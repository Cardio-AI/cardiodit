# CardioDiT-L  (~177M parameters)
# patch_size (pz, px, py, pt) = (1, 4, 4, 2) as in the paper
# input_size (Z, X, Y, T) matches the 4D latent shape after VQ-GAN encoding
# For 10x224x224x32 CMR with 8x spatial and 4x temporal compression:
#   Z=10, X=28, Y=28, T=8  →  N = 10*7*7*4 = 1960 tokens

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 16
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    self_conditioning: true
    spacing: [8.0, 1.5, 1.5, 1.0]

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"

training:
  n_epochs: 3000
  eval_freq: 10
  batch_size: 2
  num_workers: 8
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 0
  min_snr_gamma: 0.0
  grad_accum_steps: 1
  self_conditioning: true
  offset_noise_strength: 0.0
  normalize_latents: false
  # latent_stats_path: data/latents/train/latent_stats.pt

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true       # set true on cluster nodes without internet
