# MNM2 ds4 temporal-latent wide-e16 DiT config with phase descriptors.

model:
  params:
    input_size: [10, 32, 32, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1152
    depth: 16
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [10.0, 13.6, 13.6, 4.0]
    self_conditioning: true
    temporal_pe: phase
    qk_norm: true

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  n_epochs: 3000
  eval_freq: 50
  batch_size: 1
  num_workers: 8
  amp_dtype: bf16
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: true
  offset_noise_strength: 0.1
  grad_accum_steps: 8
  normalize_latents: true
  latent_stats_path: null
  phase_dir: null
  alpha_pool: linear
  use_bucket_sampler: true
  preload_latents: true

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true