# FM ablation step 02 — anisotropy-aware 4D positional embeddings
#
# Change from step 01:
#   spacing: null → [8.0, 1.5, 1.5, 1.0]
#
# Rationale: identical to DDPM step 02.  SA CMR has ~8 mm slice thickness
# and ~1.5 mm in-plane resolution.  Encoding the physical patch spacing in
# the sinusoidal positional embedding allows the model to distinguish
# how far apart spatially tokens are, which is critical for learning correct
# inter-slice anatomy.

scheduler_type: "flow_matching"

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]  # changed: was null
    self_conditioning: false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0

training:
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 8
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  grad_accum_steps: 4
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true       # set true on cluster nodes without internet
