# FM ablation step 03 — logit-normal timestep sampling tuning  (FM-only)
#
# Changes from step 02:
#   logit_mean: 0.0 → 0.5
#   logit_std:  1.0 → 0.7
#
# Rationale: the logit-normal distribution concentrates training mass near
# t = sigmoid(logit_mean).  The SD3 defaults (mean=0.0, std=1.0) are calibrated
# on natural images.  For cardiac cine MRI, the hardest denoising region may
# lie at different t, since cardiac motion is concentrated in specific phases
# (end-diastole, end-systole) and has a different spectral profile than natural images.
#
# logit_mean=0.5  →  sigmoid(0.5) ≈ 0.62, shifting mass towards moderate-noise
#                    timesteps where cardiac structure is partially revealed.
# logit_std=0.7   →  narrower concentration, focusing more compute on the
#                    mid-trajectory where the denoising task is hardest.
#
# This is a config-only change; no code modification required.
# The optimal values are dataset-specific; treat these as a reasonable starting
# point and ablate further if needed.

scheduler_type: "flow_matching"

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]
    self_conditioning: false

scheduler:
  num_train_timesteps: 1000
  sample_method: "logit_normal"
  logit_mean: 0.5                   # changed: was 0.0
  logit_std: 0.7                    # changed: was 1.0

training:
  n_epochs: 3000
  eval_freq: 50
  batch_size: 2
  num_workers: 8
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false
  grad_accum_steps: 4
  normalize_latents: false
  latent_stats_path: null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true       # set true on cluster nodes without internet
