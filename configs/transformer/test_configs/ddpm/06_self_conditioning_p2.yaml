# DDPM ablation 06: self-conditioning (on top of the v-pred / zero-terminal-SNR chain).
# Dataset: MNM2. VQ-GAN ds8xy_ds4t, roi 256×256×32 → per-slice latent (8,32,32,8),
# D=12 z-slices → 4D latent (8,12,32,32,8).
# patch_size (1, 2, 2, 2) -> 12*16*16*4 = 12288 tokens.
# spacing is per-latent-voxel (raw × stage1 downsample): Z slice 10mm (no Z ds),
# in-plane 1.5mm × ds8 = 12.0mm, T 1.0 × ds4 = 4.0.  Code multiplies by
# patch_size then normalises so smallest step = 1.0.

model:
  params:
    input_size: [12, 32, 32, 8]   # UMM: [10, 28, 28, 8]
    patch_size: [1, 2, 2, 2]
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.1
    mlp_drop: 0.1
    spacing: [10.0, 12.0, 12.0, 4.0]   # UMM: [10.0, 13.6, 13.6, 4.0]
    self_conditioning: true
    qk_norm: true

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  n_epochs: 5000
  eval_freq: 50
  batch_size: 1          # 12288 tokens (patch 2,2,2) OOMs at bs2 (~22GB); bs1 ~20GB. eff batch = 1×grad_accum6×2gpu = 12
  num_workers: 4
  amp_dtype: bf16
  scale_factor: 1.0   # per-channel normalize_latents active below; MNM2 global scale_factor = 3.762895 (1/std), use if normalize_latents:false
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 5.0
  self_conditioning: true
  offset_noise_strength: 0.1
  grad_accum_steps: 6    # eff batch 12 (1×6×2gpu)
  normalize_latents: true
  latent_stats_path: null
  sample_log:
    enabled: true
    every_n_evals: 1
    n_steps: 100
    scheduler: ddim
    eta: 0.0
    n_samples: 1
    fps: 8
    keep_stage1_on_gpu: false
    stage1_cfg: configs/stage1/best.yaml
    stage1_ckpt: outputs/stage1/best_model.pth
    latent_shape: null

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true