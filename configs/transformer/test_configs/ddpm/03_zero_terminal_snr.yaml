# DDPM sweep 02: anisotropy-aware sinusoidal positional embedding.
# Adds physical latent-voxel spacing (Z, X, Y, T) on top of the 01 baseline.
# patch_size (1, 4, 4, 2) -> 10*7*7*4 = 1960 tokens.
# spacing is per-latent-voxel (raw × stage1 downsample): Z slice 10mm (no Z ds),
# in-plane 1.7mm × ds8 = 13.6mm, T 1.0 × ds4 = 4.0.  Code multiplies by
# patch_size then normalises so smallest step = 1.0.

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 4, 4, 2]
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.1
    mlp_drop: 0.1
    spacing: [10.0, 13.6, 13.6, 4.0]
    self_conditioning: false
    qk_norm: true

scheduler:
  schedule: "cosine"
  num_train_timesteps: 1000
  prediction_type: "v_prediction"
  zero_terminal_snr: true

training:
  n_epochs: 5000
  eval_freq: 50
  batch_size: 6
  num_workers: 4
  amp_dtype: bf16
  scale_factor: 4.364003
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 5.0
  self_conditioning: false
  offset_noise_strength: 0.0
  grad_accum_steps: 2
  normalize_latents: false
  latent_stats_path: null
  sample_log:
    enabled: true
    every_n_evals: 1
    n_steps: 100
    scheduler: ddim
    eta: 0.0
    n_samples: 1
    fps: 8
    keep_stage1_on_gpu: false
    stage1_cfg: configs/stage1/best.yaml
    stage1_ckpt: ${oc.env:CARDIODIT_RUNS_DIR,${oc.env:HOME}/CardioDiT_runs}/outputs/stage1/vqgan-best-2026-04-30_13-53/last_checkpoint.pth
    latent_shape: null

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true