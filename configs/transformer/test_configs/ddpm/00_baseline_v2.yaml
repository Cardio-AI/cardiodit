# CardioDiT-B — DDPM ablation baseline
#
# Architecture: DiT-B sized for 4D CMR latents (8×10×28×28×8).
#   patch_size (pz, px, py, pt) = (1, 4, 4, 2)  →  N = 10×7×7×4 = 1960 tokens
#
# Baseline: all improvements switched OFF.  Each subsequent config
# introduces exactly one change so their individual contributions are isolated.
#
# Features already on in all runs (not part of this ablation):
#   - AdamW with separate weight-decay groups (no decay on bias/norm)
#   - Cosine warmup LR (always enabled in train_dit.py)
#   - Gradient accumulation: effective batch = 2 × 4 = 8
#   - EMA with warmup
#
# NOTE: set scale_factor after running compute_scale_factor.py on your latents.

model:
  params:
    input_size: [10, 28, 28, 8]
    patch_size: [1, 2, 2, 2]
    in_channels: 8
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.1
    mlp_drop: 0.1
    spacing: null                  # isotropic — no physical-coordinate encoding
    self_conditioning: false

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"
  zero_terminal_snr: false

training:
  n_epochs: 3000
  eval_freq: 10
  batch_size: 2
  num_workers: 4
  amp_dtype: bf16
  scale_factor: 4.364003               # replace with output of compute_scale_factor.py
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 5000
  min_snr_gamma: 0.0
  self_conditioning: false        # must match model.params.self_conditioning
  offset_noise_strength: 0.0
  grad_accum_steps: 4
  normalize_latents: false
  latent_stats_path: null

  # Validation-time sample logging — wandb only.
  # Generates one synthesized volume each `every_n_evals` validations,
  # decodes it through the VQ-GAN, and logs a mid-D slice as a video.
  sample_log:
    enabled: true
    every_n_evals: 1
    n_steps: 100
    scheduler: ddim                   # ddim | ddpm | dpm_pp | flow_matching
    eta: 0.0
    n_samples: 1
    fps: 8
    keep_stage1_on_gpu: false         # offload VQ-GAN to CPU between intervals
    stage1_cfg: configs/stage1/best.yaml                  # path to VQ-GAN config yaml
    stage1_ckpt: ${oc.env:CARDIODIT_RUNS_DIR,${oc.env:HOME}/CardioDiT_runs}/outputs/stage1/vqgan-best-2026-04-30_13-53/last_checkpoint.pth                 # path to VQ-GAN checkpoint
    latent_shape: null                # [C, D, H, W, T]; inferred from val batch if null

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true       # set true on cluster nodes without internet
