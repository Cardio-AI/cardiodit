model:
  params:
    input_size:
    - 12
    - 56
    - 56
    - 8
    patch_size:
    - 1
    - 2
    - 2
    - 2
    in_channels: 16
    hidden_size: 768
    depth: 24
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
