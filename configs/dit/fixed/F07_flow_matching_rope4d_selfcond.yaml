  latent_stats_path: null
  phase_dir: null
  alpha_pool: linear
  batch_strategy: fixed
  preload_latents: true
  keep_last_n_checkpoints: -1
  objective_loss: huber_legacy
  validation_primary_metric: unconditioned
  allow_legacy_latents: true
  sample_log:
    enabled: false
optim:
  lr: 0.0001
  weight_decay: 0.0001
  warmup_updates: 10900
  total_updates: 300000
  min_lr_ratio: 0.01
wandb:
  entity: null
