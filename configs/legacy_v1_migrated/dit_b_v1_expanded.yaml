# Migrated v1-style DiT-B config using the current expanded schema.

model:
  params:
    input_size: [10, 28, 28, 4]
    patch_size: [1, 4, 4, 1]
    in_channels: 8
    hidden_size: 1024
    depth: 12
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: true
    attn_drop: 0.0
    mlp_drop: 0.0
    spacing: [8.0, 1.5, 1.5, 1.0]
    self_conditioning: false
    temporal_pe: absolute

scheduler:
  schedule: "cosine"
  num_train_timesteps: 300
  prediction_type: "v_prediction"
  zero_terminal_snr: false

training:
  n_epochs: 3000
  eval_freq: 10
  batch_size: 2
  num_workers: 8
  amp_dtype: bf16
  scale_factor: 1.0
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 0
  min_snr_gamma: 0.0
  self_conditioning: false
  offset_noise_strength: 0.0
  grad_accum_steps: 1
  normalize_latents: false
  latent_stats_path: null
  phase_dir: null
  alpha_pool: linear
  use_bucket_sampler: false

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 100
  min_lr_ratio: 0.01

wandb:
  entity: null
  project: cardiodit-dev
  offline: true