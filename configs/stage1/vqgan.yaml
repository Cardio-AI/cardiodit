  - 256
  - 32
  target_frames: 32
  use_persistent: true
losses:
  perceptual_weight: 0.002
  jukebox_weight: 0.0
  adv_weight: 0.005
  adv_warmup: 50
  params:
    perceptual_params:
      spatial_dims: 3
      network_type: squeeze
    jukebox_params:
      spatial_dims: 3
wandb:
  entity: null
  project: cardiodit
  offline: true
