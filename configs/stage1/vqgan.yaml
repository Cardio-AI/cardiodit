model:
  params:
    spatial_dims: 3
    in_channels: 1
    out_channels: 1
    num_channels:
    - 128
    - 256
    num_res_channels:
    - 256
    - 256
    num_res_layers: 2
    downsample_parameters:
    - - 2
      - 4
      - 1
      - 1
    - - 2
      - 4
      - 1
      - 1
    upsample_parameters:
    - - 2
      - 4
      - 1
      - 1
      - 0
    - - 2
      - 4
      - 1
      - 1
      - 0
    num_embeddings: 16384
    embedding_dim: 8
