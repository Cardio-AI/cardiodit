# VQ-GAN — asymmetric: 4× spatial (H, W), 2× temporal (T)
#
# Two encoder/decoder stages.
# Stage 1: stride 2 on all dims (H, W, T).
# Stage 2: stride 2 on H and W only; T preserved.
#
# Compression:
#   H:  224 → 112 → 56    (4×)
#   W:  224 → 112 → 56    (4×)
#   T:   32 →  16 → 16    (2×)
#
# Latent per 2D+t slice: (8, 56, 56, 16)
# Full 4D latent (D=10): (8, 10, 56, 56, 16)
#
# This is the mildest compression variant. The large spatial latent (56×56)
# and near-full temporal resolution (16 frames) maximise reconstruction
# fidelity but produce many more DiT tokens — size the DiT accordingly.
#
# Stage 2 asymmetric convolution parameters (list form for MONAI VQVAE):
#   downsample: [stride, kernel, dilation, padding]
#     stride  = [2, 2, 1]   — stride 2 on H/W, no stride on T
#     kernel  = [4, 4, 1]   — 4×4 spatial kernel, point kernel on T
#     dilation = 1
#     padding = [1, 1, 0]   — maintain spatial dims; no T padding needed
#
#   upsample: [stride, kernel, dilation, padding, output_padding]
#     stride        = [2, 2, 1]
#     kernel        = [4, 4, 1]
#     dilation      = 1
#     padding       = [1, 1, 0]
#     output_padding = [0, 0, 0]

model:
  params:
    spatial_dims: 3
    in_channels: 1
    out_channels: 1
    num_channels: [128, 256]
    num_res_channels: [128, 256]
    num_res_layers: 2
    downsample_parameters:
      - [2, 4, 1, 1]                    # stage 1: stride 2 on H, W, T
      - [[2, 2, 1], [4, 4, 1], 1, [1, 1, 0]]   # stage 2: stride 2 on H, W only
    upsample_parameters:
      - [[2, 2, 1], [4, 4, 1], 1, [1, 1, 0], [0, 0, 0]]  # reverses stage 2
      - [2, 4, 1, 1, 0]                 # reverses stage 1
    num_embeddings: 4096
    embedding_dim: 8

discriminator:
  params:
    spatial_dims: 3
    num_channels: 64
    num_layers_d: 3
    in_channels: 1
    out_channels: 1

training:
  n_epochs: 500
  eval_freq: 10
  batch_size: 4
  num_workers: 8
  base_lr: 5.0e-5
  disc_lr: 5.0e-5
  lr_gamma: 0.9999
  roi_size: [224, 224, 32]   # (H, W, T) per 2D+t slice
  target_frames: 32

losses:
  perceptual_weight: 0.002
  adv_weight: 0.005
  adv_warmup: 50

wandb:
  entity: null
  project: cardiodit-dev
  offline: true       # set true on cluster nodes without internet
