# VQ-GAN — 4× downsampling on all dimensions (H, W, T)
#
# Two encoder/decoder stages, each with stride 2 on all three spatial dims.
#
# Compression:
#   H:  224 → 112 → 56    (4×)
#   W:  224 → 112 → 56    (4×)
#   T:   32 →  16 →  8    (4×)
#
# Latent per 2D+t slice: (8, 56, 56, 8)
# Full 4D latent (D=10): (8, 10, 56, 56, 8)
#
# Note: the larger spatial latent (56×56 vs 28×28 for ds8) produces
# significantly more DiT tokens. Consider this when sizing the DiT.

model:
  params:
    spatial_dims: 3
    in_channels: 1
    out_channels: 1
    num_channels: [128, 256]
    num_res_channels: [128, 256]
    num_res_layers: 2
    downsample_parameters:
      - [2, 4, 1, 1]          # stage 1: stride 2 on H, W, T
      - [2, 4, 1, 1]          # stage 2: stride 2 on H, W, T
    upsample_parameters:
      - [2, 4, 1, 1, 0]       # reverses stage 2
      - [2, 4, 1, 1, 0]       # reverses stage 1
    num_embeddings: 4096
    embedding_dim: 8
    commitment_cost: 0.25 #0.25
    decay: 0.99 #0.95
    epsilon: 1e-5

discriminator:
  params:
    spatial_dims: 3
    num_channels: 64
    num_layers_d: 3
    in_channels: 1
    out_channels: 1
    norm: "INSTANCE"

training:
  n_epochs: 600
  eval_freq: 10
  batch_size: 4
  num_workers: 8
  base_lr: 1.0e-5
  disc_lr: 3.0e-6
  lr_gamma: 0.9999
  roi_size: [224, 224, 32]   # (H, W, T) per 2D+t slice
  target_frames: 32
  use_persistent: true

losses:
  perceptual_weight: 0.2 #0.01
  jukebox_weight: 0.2 #0.2
  adv_weight: 0.09 #0.005
  adv_warmup: 0 #50
  params:
    perceptual_params:
      spatial_dims: 3
      network_type: "squeeze"
    jukebox_params:
      spatial_dims: 3

wandb:
  entity: null
  project: cardiodit-dev
  offline: true       # set true on cluster nodes without internet
