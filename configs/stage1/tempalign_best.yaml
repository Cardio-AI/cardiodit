# VQ-GAN — 8× spatial, 4× temporal (anisotropic ds8xy_ds4t)
#
# Three encoder/decoder stages: stages 1+2 stride-2 all dims, stage 3 stride-2 H/W only.
#
# Compression:
#   H:  208 → 104 → 52 → 26    (8×)
#   W:  224 → 112 → 56 → 28    (8×)
#   T:   32 →  16 →  8 →  8    (4×)
#
# Latent per 2D+t slice: (8, 26, 28, 8)
# Full 4D latent (D=10): (8, 10, 26, 28, 8)
#
# Anisotropic: preserves more temporal resolution for cardiac motion.

model:
  params:
    spatial_dims: 3
    in_channels: 1
    out_channels: 1
    num_channels: [128, 256, 256]
    num_res_channels: [128, 256, 256]
    num_res_layers: 2
    downsample_parameters:
      - [2, 4, 1, 1]                              # stage 1: stride-2 all dims
      - [2, 4, 1, 1]                              # stage 2: stride-2 all dims
      - [[2, 2, 1], [4, 4, 1], 1, [1, 1, 0]]     # stage 3: stride-2 H/W only, stride-1 T
    upsample_parameters:
      - [[2, 2, 1], [4, 4, 1], 1, [1, 1, 0], [0, 0, 0]]  # reverses stage 3
      - [2, 4, 1, 1, 0]
      - [2, 4, 1, 1, 0]
    num_embeddings: 8192
    embedding_dim: 8
    commitment_cost: 1.0
    decay: 0.7
    epsilon: 1e-5
    dropout: 0.0
    act: "RELU"

discriminator:
  params:
    spatial_dims: 3
    num_channels: 64
    num_layers_d: 3
    in_channels: 1
    out_channels: 1
    norm: "INSTANCE"

training:
  n_epochs: 500
  eval_freq: 10
  batch_size: 8
  num_workers: 8
  base_lr: 1.2e-4
  disc_lr: 4.0e-5
  lr_gamma: 0.999
  roi_size: [208, 224, 32]   # (H, W, T) per 2D+t slice — do not change
  target_frames: 32
  use_persistent: true

losses:
  perceptual_weight: 0.6
  jukebox_weight: 0.1
  adv_weight: 0.05
  adv_warmup: 50
  params:
    perceptual_params:
      spatial_dims: 3
      network_type: "squeeze"
    jukebox_params:
      spatial_dims: 3

wandb:
  entity: null
  project: cardiodit-dev
  offline: true
